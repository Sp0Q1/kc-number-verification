name: Build JAR

# Builds the provider JAR on GitHub's runners so you don't need a local
# Maven/JDK toolchain. The compiled .jar is attached to each run as a
# downloadable artifact, and to any tagged release as a release asset.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab

permissions:
  contents: write         # needed to attach the JAR to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven      # caches ~/.m2 so repeat builds are fast

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Upload the JAR and its SBOM as a build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: number-verification-jar
          path: |
            target/number-verification.jar
            target/sbom.json
          if-no-files-found: error

      - name: Attach the JAR to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            target/number-verification.jar
            target/sbom.json
